name: Cross-platform tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install linters
        run: python -m pip install ruff==0.17.4 mypy==2.4.1
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: CLI help
        run: python -m sse_agent --help
      - name: Unit and local API integration tests
        run: python -m unittest discover -s tests -v
      - name: Install package and smoke-test entrypoint
        run: |
          python -m pip install -e .
          sse-agent --version
          python -m sse_agent.evals list
