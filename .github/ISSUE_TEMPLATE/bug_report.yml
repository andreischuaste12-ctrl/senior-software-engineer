name: Bug report
description: Report a reproducible defect in the agent, skill, documentation, or tooling.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the project. Remove secrets and personal data from all evidence.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.6.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add relevant logs, commands, or a minimal fixture. Do not include secrets.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, and private source content.
          required: true
        - label: This report does not disclose an unpatched vulnerability; I will use SECURITY.md for that.
          required: true
