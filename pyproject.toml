[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "senior-software-engineer"
dynamic = ["version"]
description = "A software engineering CLI agent guided by the senior-software-engineer skill."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "skills/senior-software-engineer/LICENSE", "skills/senior-software-engineer/NOTICE"]
authors = [{ name = "Andrei Schuaste" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.4", "mypy==2.4.1"]

[project.scripts]
sse-agent = "sse_agent.__main__:main"

[tool.setuptools]
# Flat layout with multiple top-level directories: list packages explicitly.
packages = ["sse_agent", "sse_skill"]
package-dir = {sse_skill = "skills/senior-software-engineer"}

[tool.setuptools.package-data]
sse_skill = ["SKILL.md", "LICENSE", "NOTICE", "references/*.md", "references/sources/*.md", "evals/*.md", "evals/*.json"]

[tool.setuptools.dynamic]
version = { attr = "sse_agent.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
files = ["sse_agent", "scripts"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
